[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-distill"
version = "0.1.0"
description = "Modular time-series dataset distillation with post-hoc temporal fidelity restoration"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "ThetaHat" }]
keywords = [
    "time-series",
    "dataset-distillation",
    "forecasting",
    "trajectory-matching",
    "data-compression",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime requirements. torch drives every model and the distillation inner
# loop; scipy/statsmodels back the temporal-fidelity metrics (ACF, STL, spectral
# interpolation); matplotlib backs the visualization package.
dependencies = [
    "torch>=1.13",
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "statsmodels>=0.13",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
# Needed only to run the scripts under example/ (they fit their own scaler).
examples = ["scikit-learn>=1.0"]
dev = [
    "pytest>=7.0",
    "scikit-learn>=1.0",
]

[project.urls]
Homepage = "https://github.com/ThetaHat-FYP/ts-distill"
Repository = "https://github.com/ThetaHat-FYP/ts-distill"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
